services:
  fauna:
    build:
      context: .
      args:
        # UID/GID del host para que el bind-mount sea escribible.
        # Define HOST_UID/HOST_GID en .env (o en el shell) si no son 1000.
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: fauna_urbana_nyc
    restart: unless-stopped
    ports:
      - "8050:8050"
    volumes:
      # Modelo fine-tuned (28 MB) — fuera de la imagen para versionar aparte
      - ./modelos/fauna_urbana.pt:/app/modelos/fauna_urbana.pt:ro
      # Artefactos del entrenamiento (curvas, matriz, results.csv) para la pestaña Modelo del panel
      - ./modelos/fauna_urbana:/app/modelos/fauna_urbana:ro
      # Vídeo demo (31 MB, Git LFS) — fuente alternativa al stream
      - ./demo_times_square.mp4:/app/demo_times_square.mp4:ro
      # Capturas y audios TTS — persisten entre reinicios
      - ./capturas:/app/capturas
      # Directorio para SQLite (no bind-mount de fichero por WAL)
      - ./datos_bd:/app/datos_bd
      # Credenciales
      - ./.env:/app/.env:ro
      # Config editable sin rebuild
      - ./config:/app/config:ro
    environment:
      - TZ=Europe/Madrid
      # Limita el paralelismo interno de PyTorch para que la inferencia no
      # ahogue al hilo de captura/panel/MJPEG en CPU.
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
