# Configuración de Fauna Urbana NYC
# Este archivo es la única fuente de verdad para todos los parámetros del sistema.

stream:
  url: "https://www.youtube.com/watch?v=a9J1OP_x5Rg"  # Times Square Express View (alternativo mientras rnXIjl_Rzy4 está offline)
  frames_por_inferencia: 12  # Analizar 1 de cada N frames con YOLO (12 para CPU @ imgsz=960, 4 si hay GPU)

modelo:
  ruta: "modelos/fauna_urbana.pt"  # Ruta al modelo fine-tuned
  confianza_minima: 0.1

gemma:
  # Proveedor activo: cambiar con GEMMA_PROVEEDOR en .env
  #   "google"  → desarrollo: Gemini 2.5 Flash (Google AI Studio, requiere GEMINI_API_KEY)
  #              Nota: Gemma 4 NO soporta tool calling vía Google AI Studio — se usa Gemini 2.5 Flash.
  #   "ollama"  → producción: Gemma 4 local en 192.168.0.135 (sí soporta tool calling)
  proveedor: "ollama"
  modelo_nombre: "google/gemma-4-4B-it"    # HuggingFace Inference API (no usado actualmente)
  gemini_modelo: "gemini-2.5-flash"        # Google AI Studio — Gemma 4 no soporta tool calling aquí
  ollama_modelo: "gemma4:latest"           # Ollama local — soporta tool calling
  timeout_segundos: 40  # Tiempo máximo de espera antes de descartar la verificación
  clases:
    0: "batman"
    1: "deadpool"
    2: "elmo"
    3: "estatua_libertad"
    4: "gorila"
    5: "mickey_mouse"
    6: "minnie_mouse"
    7: "sonic"
    8: "spiderman"
    9: "super_mario"
    10: "transformer"

zonas:
  # Frame 1920×1080. Stream alternativo a9J1OP_x5Rg.
  # zona_izquierda: 45% izquierdo × franja inferior 45% (x=0..864, y=594..1080)
  # zona_derecha:   55% restante × misma franja inferior  (x=864..1920, y=594..1080)
  - nombre: "zona_izquierda"
    deteccion: ["batman", "deadpool", "elmo", "estatua_libertad", "gorila", "mickey_mouse", "minnie_mouse", "sonic", "spiderman", "super_mario", "transformer"]
    puntos: [[0, 594], [864, 594], [864, 1080], [0, 1080]]
  - nombre: "zona_derecha"
    deteccion: ["batman", "deadpool", "elmo", "estatua_libertad", "gorila", "mickey_mouse", "minnie_mouse", "sonic", "spiderman", "super_mario", "transformer"]
    puntos: [[864, 594], [1920, 594], [1920, 1080], [864, 1080]]

hitos:
  frames_consecutivos: 5  # Frames que debe cumplirse la condición para disparar el hito

  crossover:
    activo: true
    universos_minimos: 4          # Universos distintos presentes simultáneamente
    cooldown_segundos: 120        # Tiempo mínimo entre disparos del mismo hito

  conflicto_identidad:
    activo: true
    zona: "misma"                 # Dos del mismo tipo en la misma zona
    cooldown_segundos: 60

  hora_punta:
    activo: true
    personajes_minimos: 5
    zona: null
    cooldown_segundos: 300

  avistamiento_raro:
    activo: true
    ausencia_minutos: 30          # Minutos sin ver el personaje para considerar reaparición
    cooldown_segundos: 1800

  marvel_vs_dc:
    activo: true
    personaje_marvel: "spiderman"
    personaje_dc: "batman"
    zona: null
    cooldown_segundos: 180

panel:
  puerto: 8050

notificaciones:
  email:
    activo: true
    # GAS_EMAIL_URL va en .env

  telegram:
    activo: true                  # Requiere TELEGRAM_TOKEN y TELEGRAM_CHAT_ID en .env
    # Las credenciales van en .env, no aquí. Ver .env.example

  tts:
    activo: true

base_datos:
  ruta: "datos_bd/fauna_urbana.db"

capturas:
  carpeta: "capturas/"
  guardar_en_hito: true
